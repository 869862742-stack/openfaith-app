name: openfaith_app
description: OpenFaith - Faith-based social platform
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.0
  cached_network_image: ^3.3.1
  go_router: ^14.2.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  file_picker: ^8.0.0
  shorebird_code_push: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - shorebird.yaml
