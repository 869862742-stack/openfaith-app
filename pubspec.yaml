name: openfaith_app
description: OpenFaith - Faith-based social platform
publish_to: 'none'
version: 1.3.9+35

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  go_router: ^14.2.0
  intl: ^0.20.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  app_links: ^6.3.0
  file_picker: ^8.0.0
  audioplayers: ^6.1.0
  audio_metadata_reader: ^1.6.0
  image_picker: ^1.0.0
  image: ^4.1.3
  path_provider: ^2.1.0
  shorebird_code_push: ^2.0.0
  flutter_inappwebview: ^6.1.5
  agora_rtc_engine: ^6.5.4
  permission_handler: ^11.3.0
  sentry_flutter: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  package_info_plus: "8.2.0"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - shorebird.yaml

  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
