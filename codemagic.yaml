workflows:
  android-release:
    name: Android Release APK (Shorebird)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      java: 17
      flutter: stable
      vars:
        GITHUB_TOKEN: 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
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.pub-cache
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Flutter Doctor
        script: |
          #!/usr/bin/env bash
          set -e
          flutter doctor
      - name: Read version from pubspec.yaml
        script: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> $FCI_BUILD_ENV
          echo "📦 App version: $VERSION"
      - name: Build APK (flutter build apk)
        script: |
          #!/usr/bin/env bash
          set -e
          echo "Building release APK..."
          flutter build apk --release
          echo "APK built successfully"
      - name: Upload to GitHub Release
        script: |
          #!/usr/bin/env bash
          set -e
          
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '[:space:]')
          VERSION_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          RELEASE_TAG="v${VERSION_NAME}"
          REPO="869862742-stack/openfaith-app"
          ASSET_NAME="OpenFaith-v${VERSION_NAME}.apk"
          
          echo "Getting release info for ${RELEASE_TAG}..."
          RELEASE_INFO=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/tags/${RELEASE_TAG}")
          
          # Check if release exists, create if not
          if echo "$RELEASE_INFO" | grep -q '"message"'; then
            echo "Release ${RELEASE_TAG} not found, creating..."
            RELEASE_INFO=$(curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${RELEASE_TAG}\",\"name\":\"OpenFaith ${RELEASE_TAG}\",\"body\":\"OpenFaith v${VERSION_NAME}\"}" \
              "https://api.github.com/repos/${REPO}/releases")
          fi
          
          RELEASE_ID=$(echo "$RELEASE_INFO" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "Release ID: ${RELEASE_ID}"
          
          ASSET_ID=$(echo "$RELEASE_INFO" | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          for a in data.get('assets',[]):
              if a['name']=='${ASSET_NAME}':
                  print(a['id'])
                  break
          " 2>/dev/null || echo "")
          
          if [ -n "$ASSET_ID" ]; then
            echo "Deleting old asset ${ASSET_ID}..."
            curl -s -X DELETE -H "Authorization: token ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${REPO}/releases/assets/${ASSET_ID}"
          fi
          
          echo "Uploading APK (${ASSET_NAME}) to release ${RELEASE_TAG}..."
          curl -s -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${APK_PATH}" \
            "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}"
          
          echo ""
          echo "Upload complete!"
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - 869862742@qq.com
