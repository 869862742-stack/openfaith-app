workflows:
  android-release:
    name: Android Release APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        GITHUB_TOKEN: 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
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android Release APK
        script: flutter build apk --release --target-platform android-arm64
      - name: Upload to GitHub Release
        script: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ' | cut -d'+' -f1)
          TAG="v${VERSION}"
          echo "Version: ${VERSION}, Tag: ${TAG}"
          
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi
          
          APK_SIZE=$(stat -f%z "$APK_PATH" 2>/dev/null || stat -c%s "$APK_PATH" 2>/dev/null)
          echo "APK size: ${APK_SIZE} bytes"
          
          RELEASE_INFO=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/869862742-stack/openfaith-app/releases/tags/${TAG}")
          RELEASE_ID=$(echo "$RELEASE_INFO" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)
          
          if [ -z "$RELEASE_ID" ]; then
            echo "Creating new release ${TAG}..."
            CREATE_RESP=$(curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"OpenFaith ${TAG}\",\"body\":\"OpenFaith Android APK release ${TAG}\",\"draft\":false,\"prerelease\":false}" \
              "https://api.github.com/repos/869862742-stack/openfaith-app/releases")
            RELEASE_ID=$(echo "$CREATE_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            echo "Created release with ID: ${RELEASE_ID}"
          else
            echo "Release ${TAG} already exists with ID: ${RELEASE_ID}"
          fi
          
          # Delete existing asset with same name (if any) before uploading
          ASSETS_INFO=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/869862742-stack/openfaith-app/releases/${RELEASE_ID}/assets")
          EXISTING_ASSET_ID=$(echo "$ASSETS_INFO" | python3 -c "
          import sys,json
          assets=json.load(sys.stdin)
          for a in assets:
              if a['name']=='OpenFaith-${TAG}.apk':
                  print(a['id'])
                  break
          " 2>/dev/null)
          
          if [ -n "$EXISTING_ASSET_ID" ]; then
            echo "Deleting existing asset ID: ${EXISTING_ASSET_ID}..."
            DEL_RESP=$(curl -s -w "%{http_code}" -X DELETE \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/869862742-stack/openfaith-app/releases/assets/${EXISTING_ASSET_ID}")
            echo "Delete response: ${DEL_RESP}"
          fi
          
          UPLOAD_URL="https://uploads.github.com/repos/869862742-stack/openfaith-app/releases/${RELEASE_ID}/assets?name=OpenFaith-${TAG}.apk"
          echo "Uploading APK to: ${UPLOAD_URL}"
          
          UPLOAD_RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"${APK_PATH}" \
            "${UPLOAD_URL}")
          
          HTTP_CODE=$(echo "$UPLOAD_RESP" | tail -1)
          BODY=$(echo "$UPLOAD_RESP" | sed '$d')
          
          if [ "$HTTP_CODE" = "201" ]; then
            DOWNLOAD_URL=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('browser_download_url',''))" 2>/dev/null)
            echo "SUCCESS! APK uploaded."
            echo "Download URL: ${DOWNLOAD_URL}"
          else
            echo "Upload failed with HTTP ${HTTP_CODE}"
            echo "Response: ${BODY}"
            exit 1
          fi
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - 869862742@qq.com
