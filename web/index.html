<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OpenFaith - Faith-based social platform">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OpenFaith">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>OpenFaith</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #050816;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: white;
    }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    #error {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 20px;
      background: rgba(10, 14, 31, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      max-width: 90%;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>加载中...</div>
  </div>
  <div id="error"></div>
  
  <script>
    // WebGL 检测
    function checkWebGL() {
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
        return gl ? true : false;
      } catch (e) {
        return false;
      }
    }
    
    // 显示错误信息
    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      const errorDiv = document.getElementById('error');
      errorDiv.style.display = 'block';
      errorDiv.innerHTML = '<h2 style="margin-bottom: 15px;">加载失败</h2><p style="margin-bottom: 10px; color: #ccc;">' + message + '</p><p style="font-size: 14px; color: #888;">请尝试刷新页面或更新浏览器</p>';
    }
    
    // 捕获全局错误
    window.onerror = function(msg, url, line, col, error) {
      console.error('Global error:', msg, url, line, col, error);
      showError('页面加载出错: ' + msg);
    };
    
    // 捕获 Promise 错误
    window.onunhandledrejection = function(e) {
      console.error('Unhandled promise rejection:', e.reason);
      showError('加载失败: ' + (e.reason?.message || e.reason || '未知错误'));
    };
    
    // 检测 WebGL 支持
    if (!checkWebGL()) {
      showError('您的浏览器不支持 WebGL，无法运行 OpenFaith。请使用 Chrome、Firefox 或 Safari 的最新版本。');
    }
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // 超时检测（30秒后如果还没加载完成，显示错误）
    setTimeout(function() {
      if (document.getElementById('loading').style.display !== 'none') {
        showError('加载超时，请刷新页面重试');
      }
    }, 30000);
  </script>
</body>
</html>
