name: Shorebird Auto Patch

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - '.github/workflows/**'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
          cache: true

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Auth Shorebird
        run: shorebird auth --ci-token "${{ secrets.SHOREBIRD_CI_TOKEN }}"

      - name: Patch Android
        run: shorebird patch android --release-version=1.0.0+1
