name: Flutter Golden Test Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**/*.dart'
      - 'test/**/*.dart'
      - 'pubspec.yaml'
      - 'assets/fonts/**'

jobs:
  golden-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install Chinese fonts (NotoSans CJK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji

      - name: Run Golden Tests (generate screenshots)
        run: flutter test --update-goldens test/golden/ || true

      - name: Upload golden screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-test-results
          path: test/golden/**/goldens/*.png
          retention-days: 30
          if-no-files-found: warn
