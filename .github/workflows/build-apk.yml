name: Build Flutter APK
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Get build number
        id: buildnum
        run: |
          BUILD_NUM=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]' | cut -d'+' -f2)
          echo "build_number=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "Build number: $BUILD_NUM"

      - name: Build release APK
        run: flutter build apk --release --build-name="${{ steps.version.outputs.version }}" --build-number="${{ steps.buildnum.outputs.build_number }}"

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/OpenFaith-v${{ steps.version.outputs.version }}.apk

      - name: Upload to openfaith-releases (public repo)
        uses: softprops/action-gh-release@v2
        with:
          repository: 869862742-stack/openfaith-releases
          tag_name: v${{ steps.version.outputs.version }}
          name: OpenFaith v${{ steps.version.outputs.version }}
          body: |
            ## OpenFaith Flutter v${{ steps.version.outputs.version }}
            
            ### 下载
            点击下方 APK 文件下载安装
            
            ### 更新日志
            - 修复APK下载卡在0%的问题
            - 改进重定向处理
            - 改进下载进度显示
          files: build/app/outputs/flutter-apk/OpenFaith-v${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Update version.json in web repo
        if: success()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK_SIZE=$(du -h build/app/outputs/flutter-apk/OpenFaith-v${VERSION}.apk | cut -f1 | tr -d '[:space:]')
          
          cat > version.json << EOF
          {
            "latestVersion": "${VERSION}",
            "versionCode": ${{ steps.buildnum.outputs.build_number }},
            "downloadUrl": "https://download.openfaithhub.com/apk/latest",
            "fallbackUrl": "https://github.com/869862742-stack/openfaith-releases/releases/download/v${VERSION}/OpenFaith-v${VERSION}.apk",
            "size": "${APK_SIZE}",
            "changelog": "v${VERSION}: 修复APK下载卡在0%的问题 / 改进重定向处理 / 改进下载进度显示",
            "buildTime": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          
          CURRENT=$(curl -s -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/repos/869862742-stack/openfaith-web/contents/public/version.json" | \
            python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
          
          CONTENT=$(base64 -w0 version.json)
          curl -s -X PUT \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/869862742-stack/openfaith-web/contents/public/version.json" \
            -d "{\"message\":\"chore: update version.json to v${VERSION}\",\"content\":\"${CONTENT}\",\"sha\":\"${CURRENT}\"}"
