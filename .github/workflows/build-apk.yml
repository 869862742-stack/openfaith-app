name: Build Flutter APK
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFaith_v${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.version.outputs.version }}
          name: OpenFaith APP v${{ steps.version.outputs.version }}
          body: |
            ## OpenFaith Flutter v${{ steps.version.outputs.version }}
            
            ### 下载
            点击下方 APK 文件下载安装
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json in web repo
        if: success()
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]' | cut -d'+' -f1)
          APK_SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1 | tr -d '[:space:]')
          
          # Create new version.json content
          cat > version.json << EOF
          {
            "latestVersion": "${VERSION}",
            "downloadUrl": "https://openfaith.pages.dev/download/flutter/${VERSION}",
            "fallbackUrl": "https://github.com/${{ github.repository }}/releases/download/app-v${VERSION}/app-release.apk",
            "releaseUrl": "https://github.com/${{ github.repository }}/releases/tag/app-v${VERSION}",
            "size": "${APK_SIZE}",
            "publishedAt": "$(date +%Y-%m-%d)",
            "changelog": "Flutter v${VERSION} - 自动构建"
          }
          EOF
          
          # Get current file SHA from web repo
          CURRENT=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/869862742-stack/openfaith-web/contents/public/version.json" | \
            python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
          
          # Update version.json in web repo
          CONTENT=$(base64 -w0 version.json)
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/869862742-stack/openfaith-web/contents/public/version.json" \
            -d "{\"message\":\"chore: update version.json to Flutter v${VERSION}\",\"content\":\"${CONTENT}\",\"sha\":\"${CURRENT}\"}"
