name: Visual Comparison (Flutter Web vs Web)
on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
      - run: flutter pub get
      - run: flutter build web --release

      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          npm install puppeteer

      - name: Start Flutter Web server
        run: |
          cd build/web
          python3 -m http.server 8080 &
          echo "FLUTTER_PID=$!" >> $GITHUB_ENV

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/ > /dev/null && echo "Server ready" && break
            sleep 1
          done

      - name: Take screenshots
        run: |
          mkdir -p screenshots/flutter screenshots/web

          # 启动 xvfb 虚拟显示器
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2

          cat > screenshot.js << 'SCRIPT'
          const puppeteer = require('puppeteer');
          const fs = require('fs');

          (async () => {
            // 非 headless 模式，使用 xvfb 虚拟显示器
            const browser = await puppeteer.launch({
              headless: false,  // 关键：非 headless，让 CanvasKit/WebGL 正常工作
              executablePath: '/usr/bin/google-chrome-stable',
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });

            const viewport = { width: 375, height: 812 };

            const flutterPages = [
              { url: 'http://localhost:8080/#/', name: 'home' },
              { url: 'http://localhost:8080/#/auth/login', name: 'login' },
              { url: 'http://localhost:8080/#/auth/register', name: 'register' },
              { url: 'http://localhost:8080/#/discover', name: 'discover' },
              { url: 'http://localhost:8080/#/messages', name: 'messages' },
              { url: 'http://localhost:8080/#/learning', name: 'learning' },
              { url: 'http://localhost:8080/#/profile', name: 'profile' },
            ];

            for (const p of flutterPages) {
              console.log(`Flutter: ${p.name}...`);
              const page = await browser.newPage();
              await page.setViewport(viewport);
              await page.goto(p.url, { waitUntil: 'networkidle0', timeout: 30000 });
              // Flutter Web 需要额外时间初始化 + 渲染
              await new Promise(r => setTimeout(r, 8000));
              await page.screenshot({ path: `screenshots/flutter/${p.name}.png`, fullPage: false });
              const stats = fs.statSync(`screenshots/flutter/${p.name}.png`);
              console.log(`  -> ${p.name}.png = ${stats.size} bytes`);
              await page.close();
            }

            const webPages = [
              { url: 'https://openfaithhub.com', name: 'home' },
              { url: 'https://openfaithhub.com/auth/login', name: 'login' },
              { url: 'https://openfaithhub.com/auth/register', name: 'register' },
              { url: 'https://openfaithhub.com/discover', name: 'discover' },
              { url: 'https://openfaithhub.com/messages', name: 'messages' },
              { url: 'https://openfaithhub.com/learning', name: 'learning' },
              { url: 'https://openfaithhub.com/profile', name: 'profile' },
            ];

            for (const p of webPages) {
              console.log(`Web: ${p.name}...`);
              const page = await browser.newPage();
              await page.setViewport(viewport);
              await page.goto(p.url, { waitUntil: 'networkidle0', timeout: 30000 });
              await new Promise(r => setTimeout(r, 3000));
              await page.screenshot({ path: `screenshots/web/${p.name}.png`, fullPage: false });
              const stats = fs.statSync(`screenshots/web/${p.name}.png`);
              console.log(`  -> ${p.name}.png = ${stats.size} bytes`);
              await page.close();
            }

            await browser.close();
            console.log('All screenshots done!');
          })().catch(err => {
            console.error('Error:', err.message);
            process.exit(1);
          });
          SCRIPT

          node screenshot.js
          echo "=== File sizes ==="
          ls -la screenshots/flutter/ screenshots/web/

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-comparison-screenshots
          path: screenshots/
          retention-days: 30

      - run: kill $FLUTTER_PID 2>/dev/null || true
