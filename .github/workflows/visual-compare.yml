name: Visual Comparison (Flutter Web vs Web)
on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter 环境
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
      - run: flutter pub get
      
      # 构建 Flutter Web（HTML 渲染器，headless 截图可靠）
      - run: flutter build web --release

      # 安装 Chrome
      - run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          google-chrome-stable --version

      # 启动 Flutter Web 服务器
      - name: Start Flutter Web server
        run: |
          cd build/web
          python3 -m http.server 8080 &
          echo "FLUTTER_PID=$!" >> $GITHUB_ENV

      # 截图脚本
      - name: Take screenshots
        run: |
          mkdir -p screenshots/flutter screenshots/web
          
          PAGES=(
            "/#/"
            "/#/auth/login"
            "/#/auth/register"
            "/#/discover"
            "/#/messages"
            "/#/learning"
            "/#/profile"
          )
          NAMES=(
            "home"
            "login"
            "register"
            "discover"
            "messages"
            "learning"
            "profile"
          )
          
          # 截取 Flutter Web
          for i in "${!PAGES[@]}"; do
            echo "Capturing Flutter: ${NAMES[$i]}"
            timeout 30 google-chrome-stable --headless=new --no-sandbox --disable-gpu \
              --screenshot=screenshots/flutter/${NAMES[$i]}.png \
              --window-size=375,812 \
              --virtual-time-budget=30000 \
              "http://localhost:8080/${PAGES[$i]}" 2>/dev/null || true
            sleep 2
          done

      # 截取网页版（先输入访问密码）
      - name: Take Web screenshots
        run: |
          # First, get auth cookie by posting password
          COOKIE_JAR=/tmp/cookies.txt
          
          WEB_PAGES=(
            "https://openfaithhub.com"
            "https://openfaithhub.com/auth/login"
            "https://openfaithhub.com/auth/register"
            "https://openfaithhub.com/discover"
            "https://openfaithhub.com/messages"
            "https://openfaithhub.com/learning"
            "https://openfaithhub.com/profile"
          )
          WEB_NAMES=(
            "home"
            "login"
            "register"
            "discover"
            "messages"
            "learning"
            "profile"
          )
          
          for i in "${!WEB_PAGES[@]}"; do
            echo "Capturing Web: ${WEB_NAMES[$i]}"
            timeout 30 google-chrome-stable --headless=new --no-sandbox --disable-gpu \
              --screenshot=screenshots/web/${WEB_NAMES[$i]}.png \
              --window-size=375,812 \
              --virtual-time-budget=30000 \
              "${WEB_PAGES[$i]}" 2>/dev/null || true
            sleep 2
          done

      # 上传截图
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-comparison-screenshots
          path: screenshots/
          retention-days: 30

      - run: kill $FLUTTER_PID 2>/dev/null || true
